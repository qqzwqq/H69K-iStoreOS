name: Check Official iStoreOS Updates

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 10:00 China Standard Time (02:00 UTC).
    - cron: "0 2 * * 1"

permissions:
  contents: write

concurrency:
  group: check-istoreos-upstream
  cancel-in-progress: false

jobs:
  check-upstream:
    name: Compare official 24.10 and 25.12 branches
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out project main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compare official upstream branches
        id: compare
        shell: bash
        env:
          UPSTREAM_URL: https://github.com/istoreos/istoreos.git
        run: |
          set -Eeuo pipefail

          TRACK_FILE="sync/upstream-refs.json"
          REPORT="$RUNNER_TEMP/istoreos-upstream-report.md"
          mkdir -p sync
          : > "$REPORT"

          CHANGES_FOUND=false
          {
            echo "# Official iStoreOS upstream check"
            echo
            echo "- Checked at: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- Upstream repository: https://github.com/istoreos/istoreos"
            echo "- This check only records inspected upstream revisions; it never merges code into firmware branches."
            echo
          } >> "$REPORT"

          check_branch() {
            local version="$1"
            local upstream_branch="$2"
            local project_branch="$3"
            local base_sha head_sha compare_json status ahead behind compare_url

            base_sha="$(jq -r --arg version "$version" '.versions[$version].sha // empty' "$TRACK_FILE")"
            if [[ -z "$base_sha" ]]; then
              echo "::error::Missing baseline SHA for iStoreOS $version in $TRACK_FILE"
              return 1
            fi

            head_sha="$(git ls-remote "$UPSTREAM_URL" "refs/heads/$upstream_branch" | awk 'NR==1 {print $1}')"
            if [[ -z "$head_sha" ]]; then
              echo "::error::Cannot read official upstream branch: $upstream_branch"
              return 1
            fi

            echo "Checking iStoreOS $version: $base_sha -> $head_sha"

            {
              echo "## iStoreOS $version"
              printf -- '- Project branch: `%s`\n' "$project_branch"
              printf -- '- Official branch: `%s`\n' "$upstream_branch"
              printf -- '- Previously checked SHA: `%s`\n' "$base_sha"
              printf -- '- Current upstream SHA: `%s`\n' "$head_sha"
            } >> "$REPORT"

            if [[ "$base_sha" == "$head_sha" ]]; then
              {
                echo "- **Status: No new upstream commits.**"
                echo
              } >> "$REPORT"
              echo "No upstream changes for $version."
              return 0
            fi

            # A changed head is only accepted after the official compare API responds successfully.
            compare_json="$(curl -fsSL \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/istoreos/istoreos/compare/$base_sha...$head_sha")"

            status="$(jq -r '.status // "unknown"' <<< "$compare_json")"
            ahead="$(jq -r '.ahead_by // 0' <<< "$compare_json")"
            behind="$(jq -r '.behind_by // 0' <<< "$compare_json")"
            compare_url="$(jq -r '.html_url // empty' <<< "$compare_json")"

            {
              echo "- **Status: Official upstream revision changed** (`$status`; ahead by $ahead, behind by $behind)."
              if [[ -n "$compare_url" ]]; then
                echo "- Compare: $compare_url"
              fi
              echo "- Commits:"
              jq -r '.commits[:80][]? | "- `\(.sha[0:7])` \(.commit.message | split("\n")[0])"' <<< "$compare_json"
              echo "- Changed paths (the GitHub compare API may limit this list):"
              jq -r '.files[:150][]? | "- `\(.filename)` (\(.status), +\(.additions)/-\(.deletions))"' <<< "$compare_json"
              echo
            } >> "$REPORT"

            # Update the checked baseline only after the comparison succeeded.
            local tmp_file
            tmp_file="$(mktemp)"
            jq --arg version "$version" --arg sha "$head_sha" \
              '.versions[$version].sha = $sha' "$TRACK_FILE" > "$tmp_file"
            mv "$tmp_file" "$TRACK_FILE"

            CHANGES_FOUND=true
            echo "Detected official upstream revision change for $version."
          }

          check_branch "24.10" "istoreos-24.10" "main"
          check_branch "25.12" "istoreos-25.12" "build-25.12"

          # Persist the inspected SHAs before publishing the report. No Issues API is used.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TRACK_FILE"
          if ! git diff --cached --quiet; then
            git commit -m "chore: record checked iStoreOS upstream revisions"
            git push origin HEAD:main
          fi

          if [[ "$CHANGES_FOUND" == "true" ]]; then
            {
              echo "## Overall result"
              echo "**UPDATE DETECTED:** at least one official branch has a new checked revision."
              echo
              echo "Review the per-version comparison details below. No firmware branch was merged or modified."
              echo
              cat "$REPORT"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "upstream_changed=true" >> "$GITHUB_OUTPUT"
          else
            {
              echo "## Overall result"
              echo "**UP TO DATE:** both official branches match their recorded checked revisions."
              echo
              cat "$REPORT"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "upstream_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish check report
        if: always()
        run: |
          echo "The official upstream check result is available in the GitHub Actions run summary."
