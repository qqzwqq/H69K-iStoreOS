name: Check Official iStoreOS Updates

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 10:00 China Standard Time (02:00 UTC).
    - cron: "0 2 * * 1"

permissions:
  contents: write
  issues: write

concurrency:
  group: check-istoreos-upstream
  cancel-in-progress: false

jobs:
  check-upstream:
    name: Compare official 24.10 and 25.12 branches
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out project main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compare official upstream branches
        id: compare
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          UPSTREAM_URL: https://github.com/istoreos/istoreos.git
        run: |
          set -Eeuo pipefail

          TRACK_FILE="sync/upstream-refs.json"
          REPORT="$RUNNER_TEMP/istoreos-upstream-report.md"
          mkdir -p sync
          : > "$REPORT"

          check_branch() {
            local version="$1"
            local upstream_branch="$2"
            local project_branch="$3"
            local base_sha head_sha compare_json status ahead behind compare_url

            base_sha="$(jq -r --arg version "$version" '.versions[$version].sha // empty' "$TRACK_FILE")"
            if [[ -z "$base_sha" ]]; then
              echo "::error::Missing baseline SHA for iStoreOS $version in $TRACK_FILE"
              exit 1
            fi

            head_sha="$(git ls-remote "$UPSTREAM_URL" "refs/heads/$upstream_branch" | awk 'NR==1 {print $1}')"
            if [[ -z "$head_sha" ]]; then
              echo "::error::Cannot read official upstream branch: $upstream_branch"
              exit 1
            fi

            echo "### iStoreOS $version"
            echo "- Project branch: $project_branch"
            echo "- Official branch: $upstream_branch"
            echo "- Tracked upstream SHA: $base_sha"
            echo "- Current upstream SHA: $head_sha"

            if [[ "$base_sha" == "$head_sha" ]]; then
              echo "- Status: No upstream changes."
              echo
              return
            fi

            compare_json="$(curl -fsSL \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/istoreos/istoreos/compare/$base_sha...$head_sha")"

            status="$(jq -r '.status // "unknown"' <<< "$compare_json")"
            ahead="$(jq -r '.ahead_by // 0' <<< "$compare_json")"
            behind="$(jq -r '.behind_by // 0' <<< "$compare_json")"
            compare_url="$(jq -r '.html_url // empty' <<< "$compare_json")"

            {
              echo "## iStoreOS $version"
              echo "- Project branch: $project_branch"
              echo "- Official branch: $upstream_branch"
              echo "- Previously checked SHA: $base_sha"
              echo "- Current upstream SHA: $head_sha"
              echo "- Status: Official upstream changed ($status; ahead by $ahead, behind by $behind)."
              echo "- Compare: $compare_url"
              echo "- Commits:"
              jq -r '.commits[]? | "- `\(.sha[0:7])` \(.commit.message | split("\n")[0])"' <<< "$compare_json" | head -80
              echo "- Changed paths (GitHub compare API may limit this list):"
              jq -r '.files[]? | "- `\(.filename)` (\(.status), +\(.additions)/-\(.deletions))"' <<< "$compare_json" | head -150
              echo
            } >> "$REPORT"

            # Record the inspected upstream head. This does NOT merge or modify
            # either firmware build branch; the report is preserved in a GitHub Issue.
            local tmp_file
            tmp_file="$(mktemp)"
            jq --arg version "$version" --arg sha "$head_sha" \
              '.versions[$version].sha = $sha' "$TRACK_FILE" > "$tmp_file"
            mv "$tmp_file" "$TRACK_FILE"
            echo "Detected update for $version: $base_sha -> $head_sha"
          }

          {
            echo "# Official iStoreOS upstream check"
            echo
            echo "- Checked at: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- Upstream repository: https://github.com/istoreos/istoreos"
            echo
          } >> "$REPORT"

          check_branch "24.10" "istoreos-24.10" "main"
          check_branch "25.12" "istoreos-25.12" "build-25.12"

          if [[ "$(jq -r '.versions["24.10"].sha' "$TRACK_FILE")" == "$(jq -r '.versions["24.10"].sha' < <(git show HEAD:"$TRACK_FILE"))" ]] && \
             [[ "$(jq -r '.versions["25.12"].sha' "$TRACK_FILE")" == "$(jq -r '.versions["25.12"].sha' < <(git show HEAD:"$TRACK_FILE"))" ]]; then
            {
              echo "## Result"
              echo "Both official upstream branches match the currently recorded baseline. No issue was created."
            } >> "$GITHUB_STEP_SUMMARY"
            cat "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## Result"
            echo "Official upstream changes were detected. A review issue will be created; no firmware source or build branch is automatically merged."
            echo
            cat "$REPORT"
          } >> "$GITHUB_STEP_SUMMARY"

          DATE_TAG="$(date -u '+%Y-%m-%d')"
          ISSUE_TITLE="官方 iStoreOS 上游更新检查（$DATE_TAG）"
          if gh issue list --repo "$GH_REPO" --state open --search "$ISSUE_TITLE in:title" --json title --jq '.[].title' | grep -Fqx "$ISSUE_TITLE"; then
            echo "An open issue for this check already exists; not creating a duplicate."
          else
            gh issue create --repo "$GH_REPO" --title "$ISSUE_TITLE" --body-file "$REPORT"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TRACK_FILE"
          if ! git diff --cached --quiet; then
            git commit -m "chore: record checked iStoreOS upstream revisions"
            git push origin HEAD:main
          fi

      - name: Publish check report
        if: always()
        run: |
          echo "Open the workflow summary above for the result."
