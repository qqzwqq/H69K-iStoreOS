name: Check Official iStoreOS Updates

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 10:00 China Standard Time (02:00 UTC).
    - cron: "0 2 * * 1"

permissions:
  contents: write

concurrency:
  group: check-istoreos-upstream
  cancel-in-progress: false

jobs:
  check-upstream:
    name: Compare official 24.10 and 25.12 branches
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out project main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compare discovered and synchronized revisions
        id: compare
        shell: bash
        env:
          UPSTREAM_URL: https://github.com/istoreos/istoreos.git
        run: |
          set -Eeuo pipefail

          TRACK_FILE="sync/upstream-refs.json"
          REPORT="$RUNNER_TEMP/istoreos-upstream-report.md"
          mkdir -p sync
          : > "$REPORT"

          NEW_UPDATES=false
          PENDING_SYNC=false

          {
            echo "# Official iStoreOS upstream check"
            echo
            echo "- Checked at: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- Upstream repository: https://github.com/istoreos/istoreos"
            echo "- Discovered SHA advances automatically; synchronized SHA advances only after the project code has actually been synchronized."
            echo "- This workflow never merges upstream code or modifies firmware branches."
            echo
          } >> "$REPORT"

          compare_revisions() {
            local base_sha="$1"
            local head_sha="$2"
            curl -fsSL \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/istoreos/istoreos/compare/$base_sha...$head_sha"
          }

          append_comparison_details() {
            local compare_json="$1"
            local compare_url status ahead behind
            status="$(jq -r '.status // "unknown"' <<< "$compare_json")"
            ahead="$(jq -r '.ahead_by // 0' <<< "$compare_json")"
            behind="$(jq -r '.behind_by // 0' <<< "$compare_json")"
            compare_url="$(jq -r '.html_url // empty' <<< "$compare_json")"

            echo "- Comparison status: `$status` (ahead by $ahead, behind by $behind)." >> "$REPORT"
            if [[ -n "$compare_url" ]]; then
              echo "- Compare: $compare_url" >> "$REPORT"
            fi
            echo "- Commits:" >> "$REPORT"
            jq -r '.commits[:80][]? | "- `\(.sha[0:7])` \(.commit.message | split("\n")[0])"' <<< "$compare_json" >> "$REPORT"
            echo "- Changed paths (GitHub may limit this list):" >> "$REPORT"
            jq -r '.files[:150][]? | "- `\(.filename)` (\(.status), +\(.additions)/-\(.deletions))"' <<< "$compare_json" >> "$REPORT"
          }

          check_branch() {
            local version="$1"
            local upstream_branch="$2"
            local project_branch="$3"
            local discovered_sha synced_sha head_sha update_json pending_json
            local tmp_file

            discovered_sha="$(jq -r --arg version "$version" '.versions[$version].discovered_sha // .versions[$version].sha // empty' "$TRACK_FILE")"
            synced_sha="$(jq -r --arg version "$version" '.versions[$version].synced_sha // .versions[$version].sha // empty' "$TRACK_FILE")"

            if [[ -z "$discovered_sha" || -z "$synced_sha" ]]; then
              echo "::error::Missing discovered_sha or synced_sha for iStoreOS $version in $TRACK_FILE"
              return 1
            fi

            head_sha="$(git ls-remote "$UPSTREAM_URL" "refs/heads/$upstream_branch" | awk 'NR==1 {print $1}')"
            if [[ -z "$head_sha" ]]; then
              echo "::error::Cannot read official upstream branch: $upstream_branch"
              return 1
            fi

            {
              echo "## iStoreOS $version"
              printf -- '- Project branch: `%s`\n' "$project_branch"
              printf -- '- Official branch: `%s`\n' "$upstream_branch"
              printf -- '- Previously discovered SHA: `%s`\n' "$discovered_sha"
              printf -- '- Confirmed synchronized SHA: `%s`\n' "$synced_sha"
              printf -- '- Current official SHA: `%s`\n' "$head_sha"
            } >> "$REPORT"

            # First, advance the discovered revision only after the official compare API succeeds.
            if [[ "$discovered_sha" != "$head_sha" ]]; then
              update_json="$(compare_revisions "$discovered_sha" "$head_sha")"
              {
                echo
                echo "### Newly discovered upstream commits"
                append_comparison_details "$update_json"
              } >> "$REPORT"

              tmp_file="$(mktemp)"
              jq --arg version "$version" --arg sha "$head_sha" \
                '.versions[$version].discovered_sha = $sha | del(.versions[$version].sha)' \
                "$TRACK_FILE" > "$tmp_file"
              mv "$tmp_file" "$TRACK_FILE"
              discovered_sha="$head_sha"
              NEW_UPDATES=true
              echo "New official upstream commits discovered for $version."
            else
              echo "- New upstream commits since the previous check: **None**." >> "$REPORT"
            fi

            # Then independently compare what has been discovered with what was actually synchronized.
            if [[ "$synced_sha" != "$discovered_sha" ]]; then
              pending_json="$(compare_revisions "$synced_sha" "$discovered_sha")"
              {
                echo
                echo "### Synchronization status"
                echo "- **PENDING SYNC:** official commits have been discovered but are not yet marked as synchronized."
                append_comparison_details "$pending_json"
              } >> "$REPORT"
              PENDING_SYNC=true
              echo "Pending synchronization remains for $version."
            else
              {
                echo
                echo "- **Synchronization status: UP TO DATE.** The synchronized SHA matches the discovered SHA."
              } >> "$REPORT"
            fi

            echo >> "$REPORT"
          }

          check_branch "24.10" "istoreos-24.10" "main"
          check_branch "25.12" "istoreos-25.12" "build-25.12"

          # Persist only discovered revisions. Synchronized revisions are deliberately never advanced here.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TRACK_FILE"
          if ! git diff --cached --quiet; then
            git commit -m "chore: record discovered iStoreOS upstream revisions"
            git push origin HEAD:main
          fi

          {
            echo "## Overall result"
            if [[ "$NEW_UPDATES" == "true" ]]; then
              echo "**NEW UPDATES DETECTED:** at least one official branch has advanced since the previous check."
            else
              echo "**NO NEW UPDATES:** neither official branch has advanced since the previous check."
            fi
            if [[ "$PENDING_SYNC" == "true" ]]; then
              echo
              echo "**ACTION REQUIRED: PENDING SYNC** — discovered upstream commits remain unsynchronized."
            else
              echo
              echo "**SYNC STATUS: UP TO DATE** — both synchronized SHAs match their discovered SHAs."
            fi
            echo
            cat "$REPORT"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "new_updates=$NEW_UPDATES" >> "$GITHUB_OUTPUT"
          echo "pending_sync=$PENDING_SYNC" >> "$GITHUB_OUTPUT"

      - name: Publish check report
        if: always()
        run: |
          echo "The official upstream check result is available in the GitHub Actions run summary."
