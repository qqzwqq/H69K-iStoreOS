name: Build 调温大师 1.5.1 package

on:
  workflow_dispatch:
    inputs:
      release:
        description: "发布构建产物到 GitHub Releases"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.version }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "24.10"
            ref: "istoreos-24.10"
          - version: "25.12"
            ref: "istoreos-25.12"

    steps:
      - name: Checkout H69K package source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-pyelftools rsync unzip zlib1g-dev file wget curl
          python3 -c "from elftools.elf.elffile import ELFFile; print('pyelftools:', 'OK')"

      - name: Clone iStoreOS source
        run: |
          git clone --depth=1 --branch "${{ matrix.ref }}" \
            https://github.com/istoreos/istoreos.git openwrt

      - name: Prepare package from uploaded installation tree
        run: |
          set -eux
          src="$GITHUB_WORKSPACE/luci-app-fan-h69k-1.4.0-source"
          test -s "$src/control"
          test -s "$src/usr/sbin/hinlinkfan-daemon"
          test -s "$src/usr/lib/lua/luci/model/cbi/hinlinkfan.lua"
          mkdir -p openwrt/package/luci-app-fan-h69k
          cp -a "$src/." openwrt/package/luci-app-fan-h69k/
          cp "$GITHUB_WORKSPACE/package/luci-app-fan-h69k/Makefile" \
            openwrt/package/luci-app-fan-h69k/Makefile
          grep -q 'PKG_VERSION:=1.5.1' \
            openwrt/package/luci-app-fan-h69k/Makefile

      - name: Update feeds and install LuCI dependencies
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install luci-base luci-compat luci-lua-runtime

      - name: Configure package build for H69K ARM64
        working-directory: openwrt
        run: |
          set -eux
          # The upstream branches otherwise fall back to the generic MIPS
          # default when no device config is selected. H69K is Rockchip ARMv8.
          cat > .config <<'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_ARCH_PACKAGES="aarch64_generic"
          CONFIG_PACKAGE_luci-app-fan-h69k=m
          EOF
          make defconfig
          grep -E '^(CONFIG_TARGET_rockchip=y|CONFIG_TARGET_rockchip_armv8=y|CONFIG_TARGET_ARCH_PACKAGES="aarch64_generic")$' .config
          if grep -q 'CONFIG_TARGET_ARCH_PACKAGES="mips' .config; then
            echo "::error::错误地选择了 MIPS 工具链，停止构建"
            exit 1
          fi

      - name: Build OpenWrt host tools
        working-directory: openwrt
        run: |
          # Package compilation also needs host utilities (openssl, libdeflate-gzip, etc.).
          # Build and stage them first; otherwise a fresh source tree fails before
          # the actual fan package is reached.
          make tools/install -j"$(nproc)" V=s

      - name: Build target toolchain
        working-directory: openwrt
        run: |
          # A fresh full source checkout has no target libgcc runtime staged yet.
          # Build/install the target toolchain before compiling packages; otherwise
          # package/libs/toolchain fails while collecting libgcc_s.so.*.
          make toolchain/install -j"$(nproc)" V=s

      - name: Compile package
        working-directory: openwrt
        run: |
          make package/luci-app-fan-h69k/clean
          make package/luci-app-fan-h69k/compile -j"$(nproc)" V=s

      - name: Collect package
        run: |
          mkdir -p "artifacts/${{ matrix.version }}"
          find openwrt/bin/packages -type f \
            \( -name 'luci-app-fan-h69k_*.ipk' -o -name 'luci-app-fan-h69k-*.apk' \) \
            -exec cp -v {} "artifacts/${{ matrix.version }}/" \;
          test -n "$(find "artifacts/${{ matrix.version }}" -type f -print -quit)"
          (cd "artifacts/${{ matrix.version }}" && sha256sum * > SHA256SUMS)

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-fan-h69k-1.5.1-${{ matrix.version }}
          path: artifacts/${{ matrix.version }}/*
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fan-h69k-v1.5.1
          name: 调温大师 1.5.1
          make_latest: false
          files: artifacts/${{ matrix.version }}/*
