name: Build 调温大师 1.4.0 package

on:
  workflow_dispatch:
    inputs:
      release:
        description: "发布构建产物到 GitHub Releases"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.version }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "24.10"
            ref: "istoreos-24.10"
          - version: "25.12"
            ref: "istoreos-25.12"

    steps:
      - name: Checkout H69K package source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync unzip zlib1g-dev file wget curl

      - name: Clone iStoreOS source
        run: |
          git clone --depth=1 --branch "${{ matrix.ref }}" \
            https://github.com/istoreos/istoreos.git openwrt

      - name: Prepare package from uploaded installation tree
        run: |
          set -eux
          src="$GITHUB_WORKSPACE/luci-app-fan-h69k-1.4.0-source"
          test -s "$src/control"
          test -s "$src/sbin/hinlinkfan-daemon"
          test -s "$src/lib/lua/luci/model/cbi/hinlinkfan.lua"
          mkdir -p openwrt/package/luci-app-fan-h69k
          cp -a "$src/." openwrt/package/luci-app-fan-h69k/
          cp "$GITHUB_WORKSPACE/package/luci-app-fan-h69k/Makefile" \
            openwrt/package/luci-app-fan-h69k/Makefile
          grep -q 'PKG_VERSION:=1.4.0' \
            openwrt/package/luci-app-fan-h69k/Makefile

      - name: Update feeds and install LuCI dependencies
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install luci-base luci-compat luci-lua-runtime

      - name: Configure package build
        working-directory: openwrt
        run: |
          echo 'CONFIG_PACKAGE_luci-app-fan-h69k=m' >> .config
          make defconfig

      - name: Compile package
        working-directory: openwrt
        run: |
          make package/luci-app-fan-h69k/clean
          make package/luci-app-fan-h69k/compile -j"$(nproc)" V=s

      - name: Collect package
        run: |
          mkdir -p "artifacts/${{ matrix.version }}"
          find openwrt/bin/packages -type f \
            \( -name 'luci-app-fan-h69k_*.ipk' -o -name 'luci-app-fan-h69k-*.apk' \) \
            -exec cp -v {} "artifacts/${{ matrix.version }}/" \;
          test -n "$(find "artifacts/${{ matrix.version }}" -type f -print -quit)"
          (cd "artifacts/${{ matrix.version }}" && sha256sum * > SHA256SUMS)

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-fan-h69k-1.4.0-${{ matrix.version }}
          path: artifacts/${{ matrix.version }}/*
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fan-h69k-v1.4.0
          name: 调温大师 1.4.0
          make_latest: false
          files: artifacts/${{ matrix.version }}/*
