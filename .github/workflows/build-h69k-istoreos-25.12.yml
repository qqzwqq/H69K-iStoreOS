name: Build H69K iStoreOS 25.12

on:
  workflow_dispatch:
  push:
    branches:
      - build-25.12
    paths:
      - ".github/workflows/build-h69k-istoreos-25.12.yml"
      - "rk35xx/h69k-25.12.config"

permissions:
  contents: read

jobs:
  build:
    name: Build H69K base firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout H69K build configuration
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl \
            ccache ecj fastjar java-propose-classpath \
            libelf-dev libfuse-dev

      - name: Download iStoreOS 25.12 source
        run: |
          git clone --depth 1 \
            --branch openwrt-25.12 \
            https://github.com/istoreos/istoreos.git \
            openwrt

      - name: Check H69K device support
        working-directory: openwrt
        run: |
          grep -R -n -E \
            'Device/hinlink_opc-h6xk|TARGET_DEVICES.*hinlink_opc-h6xk' \
            target/linux/rockchip
          
          grep -R -q 'Device/hinlink_opc-h6xk' \
            target/linux/rockchip || {
              echo "ERROR: H69K device definition not found"
              exit 1
            }

      - name: Apply H69K configuration
        run: |
          test -f rk35xx/h69k-25.12.config
          cp rk35xx/h69k-25.12.config openwrt/.config

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate default configuration
        working-directory: openwrt
        run: |
          make defconfig
          grep -E \
            '^CONFIG_TARGET_rockchip=y|^CONFIG_TARGET_rockchip_armv8=y|^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_hinlink_opc-h6xk=y' \
            .config

          grep -q \
            '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_hinlink_opc-h6xk=y' \
            .config || {
              echo "ERROR: H69K target was not selected"
              exit 1
            }

      - name: Download source packages
        working-directory: openwrt
        run: |
          make download -j2

      - name: Compile firmware
        working-directory: openwrt
        run: |
          make -j2 V=s

      - name: Upload firmware artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: H69K-iStoreOS-25.12-build-output
          path: |
            openwrt/bin/targets/rockchip/armv8/
          if-no-files-found: warn
          retention-days: 7
