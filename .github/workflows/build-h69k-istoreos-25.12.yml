name: Build H69K iStoreOS 25.12

on:
  workflow_dispatch:
  push:
    branches:
      - build-25.12
    paths:
      - ".github/workflows/build-h69k-istoreos-25.12.yml"
      - "rk35xx/h69k-25.12.config"
      - "scripts/prepare-h69k-25.12.sh"
      - "luci-app-fan-h69k-build-source-1.3-25.zip"

permissions:
  contents: read

jobs:
  build:
    name: Build H69K iStoreOS 25.12
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout H69K build configuration
        uses: actions/checkout@v4
        with:
          ref: build-25.12

      - name: Check runner resources
        run: |
          echo "===== CPU ====="
          nproc
          echo "===== Memory ====="
          free -h
          echo "===== Disk ====="
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pyelftools python3-yaml \
            rsync swig unzip zlib1g-dev file wget curl \
            ccache ecj fastjar java-propose-classpath \
            libelf-dev libfuse-dev libxml-parser-perl \
            libgmp3-dev libmpc-dev libexpat1-dev zstd

      - name: Download iStoreOS 25.12 source
        run: |
          set -eu
          git clone --depth 1 \
            --branch istoreos-25.12 \
            https://github.com/istoreos/istoreos.git \
            openwrt
          git -C openwrt log -1 --oneline

      - name: Cache OpenWrt downloads
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: istoreos-25.12-downloads-${{ runner.os }}-${{ hashFiles('openwrt/include/download.mk') }}
          restore-keys: |
            istoreos-25.12-downloads-${{ runner.os }}-

      - name: Check H69K device support
        working-directory: openwrt
        run: |
          set -eu

          echo "===== Check H69K device name ====="
          grep -R -n --include='*.mk' \
            'hinlink_opc-h6xk' target/linux/rockchip

          echo "===== Check H69K compatible string ====="
          grep -R -n --include='*.mk' \
            'hinlink,opc-h69k' target/linux/rockchip

      - name: Apply H69K configuration
        run: |
          set -eu
          test -s rk35xx/h69k-25.12.config
          cp rk35xx/h69k-25.12.config openwrt/.config
          echo "H69K configuration copied."

      - name: Prepare H69K custom packages
        working-directory: openwrt
        run: |
          set -eu
          test -s "$GITHUB_WORKSPACE/scripts/prepare-h69k-25.12.sh"
          bash "$GITHUB_WORKSPACE/scripts/prepare-h69k-25.12.sh"

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          set -eu
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate default configuration
        working-directory: openwrt
        run: |
          set -eu
          make defconfig

          echo "===== Verify H69K target ====="
          grep -E \
            '^CONFIG_TARGET_rockchip=y|^CONFIG_TARGET_rockchip_armv8=y|^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_hinlink_opc-h6xk=y' \
            .config || true

          grep -q \
            '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_hinlink_opc-h6xk=y' \
            .config || {
              echo "ERROR: H69K target was not selected after defconfig"
              exit 1
            }

          echo "===== Custom package configuration ====="
          grep -E \
            '^CONFIG_PACKAGE_(luci-app-fan-h69k|luci-app-mt5700|kmod-hwmon-pwmfan|kmod-thermal|docker|dockerd|adguardhome|luci-app-adguardhome|luci-app-openclash)=y$' \
            .config || true

      - name: Download source packages
        working-directory: openwrt
        run: |
          set -eu
          make download -j4

      - name: Build OpenWrt tools first
        working-directory: openwrt
        run: |
          set -eu
          make tools/install -j4 V=s

      - name: Build OpenWrt target toolchain
        working-directory: openwrt
        run: |
          set -eu
          make toolchain/install -j4 V=s

          echo "===== Locate cross compiler ====="
          find staging_dir \
            \( -name 'aarch64-openwrt-linux-musl-gcc' \
            -o -name 'aarch64-openwrt-linux-musl-g++' \) \
            -print

      - name: Compile Rust host toolchain
        working-directory: openwrt
        run: |
          set -eu
          make package/feeds/packages/rust/host/compile -j1 V=s

      - name: Compile firmware
        working-directory: openwrt
        run: |
          set -eu
          make -j4 V=s

      - name: Verify firmware artifacts
        if: success()
        working-directory: openwrt
        run: |
          set -eu
          echo "===== Firmware output ====="
          find bin/targets/rockchip/armv8 \
            -maxdepth 2 -type f \
            \( -name '*.img.gz' \
            -o -name '*sysupgrade.bin' \
            -o -name '*.manifest' \
            -o -name '*.buildinfo' \) \
            -print

          test -n "$(find bin/targets/rockchip/armv8 \
            -maxdepth 2 -type f \
            \( -name '*.img.gz' -o -name '*sysupgrade.bin' \) \
            -print -quit)" || {
              echo "ERROR: No flashable firmware image found"
              exit 1
            }

      - name: Upload firmware artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: H69K-iStoreOS-25.12-build-output
          path: |
            openwrt/bin/targets/rockchip/armv8/
          if-no-files-found: warn
          retention-days: 7
