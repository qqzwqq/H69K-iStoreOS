name: Build H69K iStoreOS 25.12

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai
  REPO_URL: https://github.com/istoreos/istoreos
  REPO_BRANCH: istoreos-25.12
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CARGO_HOME: ${{ github.workspace }}/.cargo-home

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: "01 - Checkout customization repository"
        uses: actions/checkout@v4

      - name: "02 - Clean runner and check disk space"
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: "03 - Install build dependencies and ccache"
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3 python3-dev \
            rsync unzip zlib1g-dev file wget curl cpio perl time \
            device-tree-compiler libelf-dev python3-pip python3-venv python3-pyelftools \
            swig pkg-config ccache
          python3 -c 'import elftools; print("pyelftools available")'
          ccache --version
          ccache -M 5G
          mkdir -p "$CCACHE_DIR" "$CARGO_HOME"
          echo "===== Disk space after dependency installation ====="
          df -h

      - name: "04 - Install Rust toolchain for MT5700"
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "===== Download official rustup installer ====="
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o rustup-init.sh
          test -s rustup-init.sh

          echo "===== Install Rust stable non-interactively ====="
          sh rustup-init.sh -y --profile minimal --default-toolchain stable
          rm -f rustup-init.sh

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          source "$HOME/.cargo/env"

          echo "===== Verify Rust installation ====="
          rustc --version
          cargo --version
          rustup target add aarch64-unknown-linux-musl
          rustup target list --installed | grep -qx 'aarch64-unknown-linux-musl'

      - name: "05 - Verify Rust toolchain"
        shell: bash
        run: |
          set -Eeuo pipefail
          rustc --version
          cargo --version
          rustup target list --installed | grep -qx 'aarch64-unknown-linux-musl'

      - name: "06 - Clone official iStoreOS 25.12 source"
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --depth=1 --branch "$REPO_BRANCH" "$REPO_URL" openwrt
          echo "===== Source revision ====="
          git -C openwrt log -1 --oneline
          echo "===== Confirm H69K device definition ====="
          grep -R -n -E 'hinlink_opc-h6xk|hinlink,opc-h69k' openwrt/target/linux/rockchip

      - name: "06.1 - Add native MT5700 USB ID to option driver"
        shell: bash
        run: |
          set -Eeuo pipefail
          cd openwrt
          PATCH_FILE="$GITHUB_WORKSPACE/patches/mt5700/950-usb-serial-option-add-tdtech-3466-3301.patch"
          test -s "$PATCH_FILE" || { echo "::error::MT5700 option-driver patch is missing"; exit 1; }
          KERNEL_PATCH_DIR="target/linux/generic/hack-6.12"
          mkdir -p "$KERNEL_PATCH_DIR"
          if grep -RqsF 'USB_DEVICE_INTERFACE_CLASS(0x3466, 0x3301, 0xff)' target/linux/generic target/linux/rockchip; then
            echo "MT5700 USB ID 3466:3301 is already present in the source patches; no duplicate patch added."
          else
            cp "$PATCH_FILE" "$KERNEL_PATCH_DIR/950-usb-serial-option-add-tdtech-3466-3301.patch"
            echo "Added native option-driver match for USB ID 3466:3301."
          fi
          echo "===== Verify patch integration ====="
          grep -RniE '3466.*3301|TDTECH MT5710-CN' "$KERNEL_PATCH_DIR" || true

      - name: "07 - Restore source download cache"
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-dl-${{ runner.os }}-${{ env.REPO_BRANCH }}-${{ github.run_id }}
          restore-keys: |
            openwrt-dl-${{ runner.os }}-${{ env.REPO_BRANCH }}-
            openwrt-dl-${{ runner.os }}-

      - name: "08 - Restore ccache"
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ env.REPO_BRANCH }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ env.REPO_BRANCH }}-
            ccache-${{ runner.os }}-

      - name: "09 - Update and install feeds"
        shell: bash
        run: |
          set -Eeuo pipefail
          cd openwrt

          # Quickstart feeds used by the successful 24.10 H69K build.
          grep -q '^src-git nas_packages ' feeds.conf.default || \
            echo 'src-git nas_packages https://github.com/linkease/nas-packages.git;master' >> feeds.conf.default
          grep -q '^src-git nas_luci ' feeds.conf.default || \
            echo 'src-git nas_luci https://github.com/linkease/nas-packages-luci.git;main' >> feeds.conf.default

          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install -p nas_packages quickstart
          ./scripts/feeds install -p nas_luci luci-app-quickstart

          test -s package/feeds/nas_packages/quickstart/Makefile -o -s package/feeds/nas_packages/net/quickstart/Makefile
          test -s package/feeds/nas_luci/luci-app-quickstart/Makefile -o -s package/feeds/nas_luci/luci/luci-app-quickstart/Makefile


      - name: "09.05 - Add DiskMan source and Simplified Chinese"
        shell: bash
        run: |
          set -Eeuo pipefail
          cd openwrt
          rm -rf /tmp/luci-app-diskman package/luci-app-diskman
          git clone --depth=1 --branch master \
            https://github.com/lisaac/luci-app-diskman.git \
            /tmp/luci-app-diskman
          test -s /tmp/luci-app-diskman/applications/luci-app-diskman/Makefile
          test -s /tmp/luci-app-diskman/applications/luci-app-diskman/po/zh-cn/diskman.po
          mkdir -p package/luci-app-diskman
          cp -a /tmp/luci-app-diskman/applications/luci-app-diskman/. \
            package/luci-app-diskman/
          test -s package/luci-app-diskman/Makefile
          echo "DiskMan source and Simplified Chinese translation prepared."
          grep -E '^(PKG_NAME|PKG_VERSION|PKG_RELEASE):=' package/luci-app-diskman/Makefile || true

      - name: "09.1 - Isolate upstream AdGuardHome Go module cache"
        shell: bash
        run: |
          set -Eeuo pipefail
          cd openwrt

          AGH_MAKEFILE="feeds/packages/net/adguardhome/Makefile"
          test -s "$AGH_MAKEFILE" || { echo "::error::Upstream AdGuardHome Makefile not found"; exit 1; }

          # Keep AdGuardHome's Go modules outside dl/: dl/ is restored across workflow runs.
          # A package-specific build-tree cache prevents reuse of an incomplete module.
          python3 - "$AGH_MAKEFILE" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          anchor = "include ../../lang/golang/golang-package.mk"
          setting = "GO_MOD_CACHE_DIR:=$(BUILD_DIR)/go-mod-cache-adguardhome-$(PKG_VERSION)"
          if setting not in text:
              if anchor not in text:
                  raise SystemExit("Cannot locate golang-package.mk include in AdGuardHome Makefile")
              text = text.replace(
                  anchor,
                  anchor + "\n\n# H69K: isolate AdGuardHome Go modules from the shared cache.\n" + setting,
                  1,
              )
              path.write_text(text)
          PY

          echo "===== AdGuardHome upstream package version ====="
          grep -E '^(PKG_VERSION|PKG_RELEASE):=' "$AGH_MAKEFILE"
          grep -q 'GO_MOD_CACHE_DIR:=$(BUILD_DIR)/go-mod-cache-adguardhome-$(PKG_VERSION)' "$AGH_MAKEFILE"
          echo "AdGuardHome will use an isolated Go module cache."

      - name: "10 - Add H69K fan-control package"
        shell: bash
        run: |
          set -Eeuo pipefail
          cd openwrt
          archive="$GITHUB_WORKSPACE/luci-app-fan-h69k-build-source-1.3-25.zip"
          test -s "$archive" || { echo "::error::H69K fan package archive missing: $archive"; exit 1; }
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          unzip -q "$archive" -d "$tmpdir"
          fan_makefile="$(find "$tmpdir" -type f -path '*/luci-app-fan-h69k-build-source/Makefile' -print -quit)"
          test -n "$fan_makefile" || { echo "::error::Cannot find fan package Makefile inside archive"; exit 1; }
          rm -rf package/luci-app-fan-h69k
          mkdir -p package/luci-app-fan-h69k
          cp -a "$(dirname "$fan_makefile")/." package/luci-app-fan-h69k/
          test -s package/luci-app-fan-h69k/Makefile
          echo "H69K fan-control package prepared."

      - name: "11 - Add OpenClash package"
        shell: bash
        run: |
          set -Eeuo pipefail
          cd openwrt
          rm -rf /tmp/OpenClash package/luci-app-openclash
          git clone --depth=1 --branch master https://github.com/vernesong/OpenClash.git /tmp/OpenClash
          test -s /tmp/OpenClash/luci-app-openclash/Makefile
          mkdir -p package/luci-app-openclash
          cp -a /tmp/OpenClash/luci-app-openclash/. package/luci-app-openclash/
          test -s package/luci-app-openclash/Makefile
          echo "OpenClash package source prepared."

      - name: "12 - Add MT5700 package"
        shell: bash
        run: |
          set -Eeuo pipefail
          cd openwrt
          rm -rf package/luci-app-mt5700
          git clone --depth=1 --branch main https://github.com/qqzwqq/luci-app-mt5700.git package/luci-app-mt5700
          test -s package/luci-app-mt5700/Makefile
          test -s package/luci-app-mt5700/src/Makefile
          test -s package/luci-app-mt5700/src/rust/Cargo.toml
          echo "MT5700 package source prepared."
          grep -E '^(PKG_NAME|PKG_VERSION|PKG_RELEASE)[[:space:]]*[:?+]?=' package/luci-app-mt5700/Makefile || true

      - name: "13 - Restore Rust Cargo cache"
        uses: actions/cache@v4
        with:
          path: |
            .cargo-home/registry
            .cargo-home/git
            openwrt/package/luci-app-mt5700/src/rust/target
          key: cargo-${{ runner.os }}-${{ env.REPO_BRANCH }}-${{ hashFiles('openwrt/package/luci-app-mt5700/src/rust/Cargo.toml', 'openwrt/package/luci-app-mt5700/src/rust/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.REPO_BRANCH }}-${{ hashFiles('openwrt/package/luci-app-mt5700/src/rust/Cargo.toml', 'openwrt/package/luci-app-mt5700/src/rust/Cargo.lock') }}-
            cargo-${{ runner.os }}-${{ env.REPO_BRANCH }}-

      - name: "14 - Load H69K 25.12 configuration migrated from 24.10"
        shell: bash
        run: |
          set -Eeuo pipefail
          cd openwrt
          CONFIG_FILE="$GITHUB_WORKSPACE/rk35xx/h69k-25.12.config"
          test -s "$CONFIG_FILE" || { echo "::error::H69K 25.12 config missing"; exit 1; }
          cp "$CONFIG_FILE" .config
          echo "===== Resolve package selection against official 25.12 source ====="
          make defconfig

      - name: "15 - Verify H69K target and essential packages"
        shell: bash
        run: |
          set -Eeuo pipefail
          cd openwrt
          check_config() {
            local key="$1"
            if ! grep -qxF "${key}=y" .config; then
              echo "::error::Required config did not survive make defconfig: ${key}=y"
              return 1
            fi
          }
          check_config CONFIG_TARGET_rockchip
          check_config CONFIG_TARGET_rockchip_armv8
          check_config CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_hinlink_opc-h6xk
          for package in \
            luci uhttpd uhttpd-mod-ubus \
            luci-app-fan-h69k luci-app-mt5700 \
            luci-app-openclash adguardhome luci-app-adguardhome \
            docker dockerd kmod-hwmon-pwmfan kmod-thermal \
            quickstart luci-app-quickstart luci-app-store \
            luci-app-diskman luci-i18n-diskman-zh-cn luci-compat \
            swap-utils parted smartmontools lsblk blkid e2fsprogs \
            mdadm kmod-md-mod kmod-md-raid1 \
            kmod-usb-serial kmod-usb-serial-option \
            kmod-usb-net-cdc-ether kmod-usb-net-cdc-ncm \
            kmod-usb-net-cdc-mbim kmod-usb-net-qmi-wwan \
            kmod-usb-storage kmod-usb-storage-uas \
            kmod-scsi-core kmod-ata-core kmod-ata-ahci \
            kmod-fs-ext4 kmod-fs-vfat kmod-fs-ntfs3 \
            openssh-sftp-server rpcd-mod-file luci-lib-fs \
            luci-app-filetransfer samba4-server luci-app-samba4; do
            check_config "CONFIG_PACKAGE_${package}"
          done
          echo "===== H69K 25.12 rootfs image capacity ====="
          grep -E '^CONFIG_TARGET_(KERNEL|ROOTFS)_PARTSIZE=' .config || true
          if ! grep -qxF 'CONFIG_TARGET_ROOTFS_PARTSIZE=1024' .config; then
            echo "::error::H69K rootfs image capacity must be 1024 MiB for the selected built-in packages"
            exit 1
          fi
          echo "H69K rootfs capacity check passed (1024 MiB)."
          echo "H69K 25.12 configuration checks passed."

      - name: "16 - Download build sources"
        shell: bash
        run: |
          set -Eeuo pipefail
          cd openwrt
          LOG="$GITHUB_WORKSPACE/build.log"
          touch "$LOG"
          echo "===== Download sources =====" | tee -a "$LOG"
          make download -j2 2>&1 | tee -a "$LOG"
          find dl -type f -size -1024c -delete
          echo "===== Download stage complete =====" | tee -a "$LOG"

      - name: "17 - Compile host tools"
        shell: bash
        run: |
          set -Eeuo pipefail
          cd openwrt
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "===== Build host tools =====" | tee -a "$LOG"
          make tools/install -j2 V=s 2>&1 | tee -a "$LOG"

      - name: "18 - Compile toolchain"
        shell: bash
        run: |
          set -Eeuo pipefail
          cd openwrt
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "===== Build toolchain =====" | tee -a "$LOG"
          make toolchain/install -j2 V=s 2>&1 | tee -a "$LOG"

      - name: "18.1 - Prepare and verify AdGuardHome Go dependencies"
        shell: bash
        run: |
          set -Eeuo pipefail
          cd openwrt

          echo "===== Prepare upstream AdGuardHome source ====="
          make package/feeds/packages/adguardhome/prepare

          echo "===== Build OpenWrt's Go host compiler explicitly ====="
          # Go is a host package dependency, not part of make toolchain/install.
          # Build it before running the dependency preflight below.
          make package/feeds/packages/golang/host/compile -j2 V=s 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

          AGH_DIR="$(find build_dir/target-aarch64_generic_musl -maxdepth 1 -type d -name 'AdGuardHome-*' -print -quit)"
          test -n "$AGH_DIR" || { echo "::error::AdGuardHome source directory was not prepared"; exit 1; }
          test -s "$AGH_DIR/go.mod" || { echo "::error::AdGuardHome go.mod is missing"; exit 1; }

          echo "===== Verify upstream Go toolchain and pinned dependency ====="
          grep -qx 'go 1.26.6' "$AGH_DIR/go.mod" || {
            echo "::error::Unexpected AdGuardHome Go version requirement"
            grep '^go ' "$AGH_DIR/go.mod"
            exit 1
          }
          grep -Eq '^[[:space:]]+github.com/google/go-cmp v0.7.0$' "$AGH_DIR/go.mod" || {
            echo "::error::Unexpected google/go-cmp version in upstream go.mod"
            grep 'github.com/google/go-cmp' "$AGH_DIR/go.mod" || true
            exit 1
          }

          echo "===== Locate the Go compiler installed by the OpenWrt host package ====="
          GO_BIN=""
          # OpenWrt's golang-package.mk adds:
          #   $(STAGING_DIR_HOSTPKG)/lib/go-$(GO_HOST_VERSION)/bin
          # Do not hard-code a shortened Go version (for example go-1.26).
          for candidate in staging_dir/hostpkg/lib/go-*/bin/go \
                           staging_dir/hostpkg/bin/go \
                           staging_dir/host/bin/go; do
            if [ -x "$candidate" ]; then
              GO_BIN="$PWD/$candidate"
              break
            fi
          done
          if [ -z "$GO_BIN" ]; then
            echo "===== Go compiler candidates under staging_dir ====="
            find staging_dir -path '*/bin/go' -print 2>/dev/null || true
            echo "::error::OpenWrt host Go compiler was not found after golang/host/compile"
            exit 1
          fi

          echo "Using Go compiler: $GO_BIN"
          GO_VERSION_OUTPUT="$("$GO_BIN" version)"
          echo "$GO_VERSION_OUTPUT"
          GO_VERSION="$(printf '%s\n' "$GO_VERSION_OUTPUT" | sed -nE 's/.* go([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')"
          if [ -z "$GO_VERSION" ]; then
            echo "::error::Cannot parse OpenWrt host Go version: $GO_VERSION_OUTPUT"
            exit 1
          fi
          IFS=. read -r GO_MAJOR GO_MINOR GO_PATCH <<< "$GO_VERSION"
          echo "Detected OpenWrt host Go version: $GO_VERSION"
          # AdGuardHome's go.mod requires Go 1.26.6; newer patch releases
          # (for example the upstream feed's Go 1.26.9) are compatible.
          if (( GO_MAJOR < 1 || (GO_MAJOR == 1 && GO_MINOR < 26) || \
                (GO_MAJOR == 1 && GO_MINOR == 26 && GO_PATCH < 6) )); then
            echo "::error::AdGuardHome requires Go >= 1.26.6; found $GO_VERSION"
            exit 1
          fi

          echo "===== Fetch and validate google/go-cmp in isolated cache ====="
          TARGET_BUILD_DIR="$(find build_dir -maxdepth 1 -type d -name 'target-*' -print -quit)"
          test -n "$TARGET_BUILD_DIR" || { echo "::error::OpenWrt target build directory not found"; exit 1; }
          AGH_VERSION="$(sed -n 's/^PKG_VERSION:=//p' feeds/packages/net/adguardhome/Makefile | head -n1)"
          test -n "$AGH_VERSION" || { echo "::error::Cannot read AdGuardHome PKG_VERSION"; exit 1; }
          echo "AdGuardHome package version: $AGH_VERSION"
          # Go requires GOMODCACHE to be an absolute path. TARGET_BUILD_DIR
          # is returned by find as a path relative to the OpenWrt source root.
          TARGET_BUILD_DIR="$(realpath "$TARGET_BUILD_DIR")"
          export GOMODCACHE="$TARGET_BUILD_DIR/go-mod-cache-adguardhome-$AGH_VERSION"
          export GOTOOLCHAIN=local
          # Start with a clean module cache so no partial extraction can survive.
          rm -rf "$GOMODCACHE"
          mkdir -p "$GOMODCACHE"
          cd "$AGH_DIR"
          "$GO_BIN" mod download -json github.com/google/go-cmp@v0.7.0
          test -s "$GOMODCACHE/github.com/google/go-cmp@v0.7.0/cmp/internal/flags/flags.go" || {
            echo "::error::google/go-cmp v0.7.0 is incomplete in the isolated module cache"
            exit 1
          }
          echo "AdGuardHome Go dependency preflight passed."

      - name: "18.2 - Isolate Docker Compose Go module cache"
        shell: bash
        run: |
          set -Eeuo pipefail
          cd openwrt

          echo "===== Locate upstream Docker Compose package ====="
          COMPOSE_MAKEFILE="$(find feeds -type f -path "*/docker-compose/Makefile" -print -quit)"
          test -n "$COMPOSE_MAKEFILE" -a -s "$COMPOSE_MAKEFILE" || {
            echo "::error::Docker Compose Makefile was not found in installed feeds"
            exit 1
          }
          echo "Docker Compose Makefile: $COMPOSE_MAKEFILE"

          echo "===== Give Docker Compose an isolated Go module cache ====="
          python3 - "$COMPOSE_MAKEFILE" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          anchor = "include ../../lang/golang/golang-package.mk"
          setting = "GO_MOD_CACHE_DIR:=$(BUILD_DIR)/go-mod-cache-docker-compose-$(PKG_VERSION)"
          if setting not in text:
              if anchor not in text:
                  raise SystemExit("Cannot locate golang-package.mk include in Docker Compose Makefile")
              text = text.replace(
                  anchor,
                  anchor + "\n\n# H69K: isolate Docker Compose Go modules from the shared dl/go-mod-cache.\n" + setting,
                  1,
              )
              path.write_text(text)
          PY

          grep -Fq 'GO_MOD_CACHE_DIR:=$(BUILD_DIR)/go-mod-cache-docker-compose-$(PKG_VERSION)' "$COMPOSE_MAKEFILE"
          echo "Docker Compose will use a package-specific Go module cache under build_dir."
          echo "The shared dl/go-mod-cache will no longer be used by Docker Compose."

      - name: "19 - Compile H69K firmware"
        shell: bash
        run: |
          set -Eeuo pipefail
          cd openwrt
          LOG="$GITHUB_WORKSPACE/build.log"
          export CARGO_HOME="$GITHUB_WORKSPACE/.cargo-home"
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-openwrt-linux-musl-gcc
          export CC_aarch64_unknown_linux_musl=aarch64-openwrt-linux-musl-gcc
          export AR_aarch64_unknown_linux_musl=aarch64-openwrt-linux-musl-ar
          echo "===== ccache before firmware compile =====" | tee -a "$LOG"
          ccache -s | tee -a "$LOG"
          echo "===== Compile firmware =====" | tee -a "$LOG"
          make -j2 V=s 2>&1 | tee -a "$LOG"
          echo "===== ccache after firmware compile =====" | tee -a "$LOG"
          ccache -s | tee -a "$LOG"
          echo "===== Build completed =====" | tee -a "$LOG"

      - name: "19.1 - List official-format firmware images"
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="openwrt/bin/targets/rockchip"
          echo "===== Firmware images generated by upstream image rules ====="
          find "$OUT" -maxdepth 4 -type f \
            \( -name '*hinlink_opc-h6xk*' -o -name '*hinlink_opc-h6xk*manifest' \) \
            -printf '%p (%s bytes)\\n' | sort
          echo "===== Image listing complete; no custom combined-image requirement ====="
      - name: "19.2 - Save OpenWrt download cache"
        if: always()
        uses: actions/cache/save@v4
        with:
          path: openwrt/dl
          key: openwrt-dl-${{ runner.os }}-${{ env.REPO_BRANCH }}-${{ github.run_id }}

      - name: "19.3 - Save ccache"
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ env.REPO_BRANCH }}-${{ github.run_id }}

      - name: "19.4 - Save Rust Cargo cache"
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .cargo-home/registry
            .cargo-home/git
            openwrt/package/luci-app-mt5700/src/rust/target
          key: cargo-${{ runner.os }}-${{ env.REPO_BRANCH }}-${{ hashFiles('openwrt/package/luci-app-mt5700/src/rust/Cargo.toml', 'openwrt/package/luci-app-mt5700/src/rust/Cargo.lock') }}-${{ github.run_id }}

      - name: "20 - Upload full build log (always)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: H69K-iStoreOS-25.12-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 14

      - name: "21 - Upload firmware artifacts"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: H69K-iStoreOS-25.12-Firmware
          path: |
            openwrt/bin/targets/rockchip/**
            !openwrt/bin/targets/rockchip/**/packages/**
          if-no-files-found: error
          retention-days: 14
