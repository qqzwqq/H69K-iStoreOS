name: Build H69K iStoreOS 24.10

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  REPO_URL: https://github.com/istoreos/istoreos
  REPO_BRANCH: istoreos-24.10
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout customization repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3 \
            python3-distutils rsync unzip zlib1g-dev \
            file wget curl cpio perl time \
            device-tree-compiler libelf-dev \
            python3-pip python3-venv swig

          python3 -m pip install --user pyelftools
          python3 -c "import elftools; print('pyelftools OK:', elftools.__file__)"

      - name: Install Rust toolchain and ARM64 target
        run: |
          set -e
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"

          rustup target add aarch64-unknown-linux-musl

          echo "===== Rust version ====="
          rustc --version
          cargo --version

          echo "===== Installed Rust targets ====="
          rustup target list --installed
          rustup target list --installed \
            | grep -qx 'aarch64-unknown-linux-musl'

      - name: Clone official iStoreOS 24.10 source
        run: |
          set -e
          git clone --depth=1 \
            --branch "$REPO_BRANCH" \
            "$REPO_URL" openwrt

      - name: Configure H69K target
        run: |
          set -e

          test -s rk35xx/h69k-24.10.config
          cp rk35xx/h69k-24.10.config openwrt/.config

          cd openwrt

          echo "===== Verify H69K device definition ====="

          grep -q 'TARGET_DEVICES += hinlink_opc-h6xk' \
            target/linux/rockchip/image/legacy.mk

          grep -q 'hinlink,opc-h69k' \
            target/linux/rockchip/image/legacy.mk

          echo "H69K device definition found."

      # 关键修复：先注册 OpenClash feed，再更新和安装 feeds。
      - name: Register OpenClash feed
        run: |
          set -e
          cd openwrt

          if ! grep -q '^src-git openclash ' feeds.conf.default; then
            echo 'src-git openclash https://github.com/vernesong/OpenClash.git' \
              >> feeds.conf.default
          fi

          echo "===== Registered OpenClash feed ====="
          grep '^src-git openclash ' feeds.conf.default

      - name: Update and install feeds
        run: |
          set -e
          cd openwrt

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          echo "===== Verify OpenClash feed package ====="
          test -s package/feeds/openclash/luci-app-openclash/Makefile
          ls -l package/feeds/openclash/luci-app-openclash/Makefile

      - name: Add custom packages
        run: |
          set -e

          chmod +x "$GITHUB_WORKSPACE/scripts/prepare-h69k-24.10.sh"

          cd openwrt
          "$GITHUB_WORKSPACE/scripts/prepare-h69k-24.10.sh"

          echo "===== Verify custom package Makefiles ====="
          test -s package/luci-app-fan-h69k/Makefile
          test -s package/luci-app-mt5700/Makefile
          test -s package/luci-app-adguardhome/Makefile

      - name: Prepare OpenClash translation compiler
        run: |
          set -e
          cd openwrt/package/feeds/openclash/luci-app-openclash/tools/po2lmo

          test -s Makefile
          make
          sudo make install

          echo "===== Verify po2lmo ====="
          command -v po2lmo

      - name: Verify package sources
        run: |
          set -e
          cd openwrt

          test -s package/feeds/openclash/luci-app-openclash/Makefile
          test -s package/luci-app-fan-h69k/Makefile
          test -s package/luci-app-mt5700/Makefile
          test -s package/luci-app-adguardhome/Makefile

          grep -Fq 'define Package/$(PKG_NAME)' \
            package/feeds/openclash/luci-app-openclash/Makefile

          grep -q 'define Package/luci-app-adguardhome' \
            package/luci-app-adguardhome/Makefile

          echo "All package source checks passed."

      - name: Resolve and verify configuration
        run: |
          set -e
          cd openwrt

          echo "===== OpenClash config before defconfig ====="
          grep '^CONFIG_PACKAGE_luci-app-openclash=' .config || true

          make defconfig

          echo "===== Resolved target and package configuration ====="
          grep -E \
            '^(CONFIG_TARGET_rockchip|CONFIG_TARGET_rockchip_armv8|CONFIG_TARGET_DEVICE_.*hinlink_opc-h6xk|CONFIG_PACKAGE_luci-app-fan-h69k|CONFIG_PACKAGE_luci-app-mt5700|CONFIG_PACKAGE_kmod-hwmon-pwmfan|CONFIG_PACKAGE_kmod-thermal|CONFIG_PACKAGE_docker|CONFIG_PACKAGE_dockerd|CONFIG_PACKAGE_adguardhome|CONFIG_PACKAGE_luci-app-adguardhome|CONFIG_PACKAGE_luci-app-openclash)=' \
            .config || true

          echo "===== Check required configuration ====="

          grep -q '^CONFIG_TARGET_rockchip=y$' .config
          grep -q '^CONFIG_TARGET_rockchip_armv8=y$' .config

          grep -q '^CONFIG_PACKAGE_luci-app-fan-h69k=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-mt5700=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-hwmon-pwmfan=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-thermal=y$' .config

          grep -q '^CONFIG_PACKAGE_docker=y$' .config
          grep -q '^CONFIG_PACKAGE_dockerd=y$' .config

          grep -q '^CONFIG_PACKAGE_adguardhome=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-adguardhome=y$' .config

          if ! grep -q '^CONFIG_PACKAGE_luci-app-openclash=y$' .config; then
            echo "ERROR: OpenClash was removed from .config by make defconfig."
            echo "===== OpenClash Makefile dependencies ====="
            grep -n -A4 'define Package/$(PKG_NAME)' \
              package/feeds/openclash/luci-app-openclash/Makefile || true
            echo "===== OpenClash package files ====="
            ls -la package/feeds/openclash/luci-app-openclash/
            exit 1
          fi

          if ! grep -q '^CONFIG_TARGET_DEVICE_.*hinlink_opc-h6xk=y$' .config; then
            echo "ERROR: H69K device target was not selected by defconfig."
            exit 1
          fi

          echo "All required configuration checks passed."

      - name: Download sources
        run: |
          set -e
          cd openwrt

          make download -j8
          find dl -type f -size -1024c -delete

      - name: Compile firmware
        run: |
          set -e
          cd openwrt

          set -o pipefail
          make -j"$(nproc)" V=s 2>&1 \
            | tee "$GITHUB_WORKSPACE/build.log"

      - name: Collect build outputs
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build-output"

          if [ -d openwrt/bin/targets/rockchip/armv8 ]; then
            cp -a openwrt/bin/targets/rockchip/armv8 \
              "$GITHUB_WORKSPACE/build-output/firmware"
          fi

          if [ -d openwrt/bin/packages ]; then
            cp -a openwrt/bin/packages \
              "$GITHUB_WORKSPACE/build-output/packages"
          fi

          if [ -f "$GITHUB_WORKSPACE/build.log" ]; then
            cp "$GITHUB_WORKSPACE/build.log" \
              "$GITHUB_WORKSPACE/build-output/build.log"
          fi

          echo "===== Collected output files ====="
          find "$GITHUB_WORKSPACE/build-output" -type f -print || true

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: H69K-iStoreOS-24.10
          path: build-output/
          if-no-files-found: warn
          retention-days: 14
