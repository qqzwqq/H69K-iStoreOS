
name: Build H69K iStoreOS 24.10

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  REPO_URL: https://github.com/istoreos/istoreos
  REPO_BRANCH: istoreos-24.10
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout customization repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3 \
            python3-distutils rsync unzip zlib1g-dev \
            file wget curl cpio perl time \
            device-tree-compiler libelf-dev

      - name: Clone official iStoreOS 24.10 source
        run: |
          git clone --depth=1 \
            --branch "$REPO_BRANCH" \
            "$REPO_URL" openwrt

      - name: Configure H69K target
        run: |
          cp rk35xx/h69k-24.10.config openwrt/.config
          cd openwrt

          grep -q 'TARGET_DEVICES += hinlink_opc-h6xk' \
            target/linux/rockchip/image/legacy.mk
          grep -q 'hinlink,opc-h69k' \
            target/linux/rockchip/image/legacy.mk

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add custom packages
        run: |
          chmod +x "$GITHUB_WORKSPACE/scripts/prepare-h69k-24.10.sh"
          cd openwrt
          "$GITHUB_WORKSPACE/scripts/prepare-h69k-24.10.sh"

      - name: Verify package Makefiles
        run: |
          cd openwrt

          test -s package/luci-app-fan-h69k/Makefile
          test -s package/luci-app-mt5700/Makefile
          test -s package/luci-app-adguardhome/Makefile

          find package feeds -type f -name Makefile \
            -exec grep -l 'Package/adguardhome' {} + \
            > /tmp/adguard-core-files.txt || true

          if [ ! -s /tmp/adguard-core-files.txt ]; then
            echo "ERROR: AdGuard Home core package not found"
            exit 1
          fi

          cat /tmp/adguard-core-files.txt

      - name: Verify configuration
        run: |
          cd openwrt
          make defconfig

          grep -E \
            '^(CONFIG_TARGET_rockchip_armv8|CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_hinlink_opc-h6xk|CONFIG_PACKAGE_luci-app-fan-h69k|CONFIG_PACKAGE_luci-app-mt5700|CONFIG_PACKAGE_adguardhome|CONFIG_PACKAGE_luci-app-adguardhome)=' \
            .config || true

          grep -q '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_hinlink_opc-h6xk=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-fan-h69k=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-mt5700=y$' .config
          grep -q '^CONFIG_PACKAGE_adguardhome=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-adguardhome=y$' .config

      - name: Download sources
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -delete

      - name: Compile firmware
        run: |
          cd openwrt
          make -j"$(nproc)" || make -j1 V=s

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: H69K-iStoreOS-24.10
          path: openwrt/bin/targets/rockchip/armv8/*
          if-no-files-found: error
          retention-days: 14
