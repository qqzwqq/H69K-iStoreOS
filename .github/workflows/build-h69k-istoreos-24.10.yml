name: Build H69K iStoreOS 24.10

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai
  REPO_BRANCH: istoreos-24.10

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      # 1. 获取你的自定义仓库
      - name: Checkout customization repository
        uses: actions/checkout@v4

      # 2. 清理不必要的预装环境，不删除 hostedtoolcache
      - name: Cleanup build environment
        run: |
          set -eu
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      # 3. 安装编译依赖
      - name: Install build dependencies
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3 \
            python3-distutils rsync unzip zlib1g-dev \
            file wget curl cpio perl time \
            device-tree-compiler libelf-dev \
            python3-pip python3-venv swig \
            pkg-config

          python3 -m pip install --user pyelftools

      # 4. 安装 Rust 和 ARM64 musl 标准库
      # 不再使用 curl | sh，避免下载异常内容被当作 Shell 脚本执行
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Verify Rust toolchain
        run: |
          set -eu
          rustc --version
          cargo --version
          rustup target list --installed
          rustup target list --installed \
            | grep -qx 'aarch64-unknown-linux-musl'

      # 5. 获取官方 iStoreOS 24.10 源码
      - name: Clone official iStoreOS 24.10 source
        run: |
          set -eu
          git clone --depth=1 \
            --branch "$REPO_BRANCH" \
            https://github.com/istoreos/istoreos.git \
            openwrt

          git -C openwrt log -1 --oneline

      # 6. 更新并安装官方 feeds
      - name: Update and install feeds
        run: |
          set -eu
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 7. 准备调温大师、AdGuard Home 等自定义源码
      - name: Prepare H69K custom packages
        run: |
          set -eu
          cd openwrt

          if [ ! -f "$GITHUB_WORKSPACE/scripts/prepare-h69k-24.10.sh" ]; then
            echo "ERROR: 找不到 prepare-h69k-24.10.sh"
            exit 1
          fi

          chmod +x "$GITHUB_WORKSPACE/scripts/prepare-h69k-24.10.sh"
          "$GITHUB_WORKSPACE/scripts/prepare-h69k-24.10.sh"

      # 8. 添加 OpenClash
      - name: Add OpenClash
        run: |
          set -eu
          cd openwrt

          rm -rf /tmp/OpenClash
          rm -rf package/luci-app-openclash

          git clone --depth=1 \
            --branch master \
            https://github.com/vernesong/OpenClash.git \
            /tmp/OpenClash

          test -s /tmp/OpenClash/luci-app-openclash/Makefile
          mkdir -p package/luci-app-openclash
          cp -a /tmp/OpenClash/luci-app-openclash/. \
            package/luci-app-openclash/

          echo "OpenClash source check passed."

      # 9. 添加 MT5700
      - name: Add MT5700 package
        run: |
          set -eu
          cd openwrt

          rm -rf package/luci-app-mt5700

          git clone --depth=1 \
            --branch main \
            https://github.com/qqzwqq/luci-app-mt5700.git \
            package/luci-app-mt5700

          test -s package/luci-app-mt5700/Makefile
          test -s package/luci-app-mt5700/src/Makefile
          test -s package/luci-app-mt5700/src/rust/Cargo.toml

          echo "MT5700 source check passed."
          grep -E '^(PKG_NAME|PKG_VERSION|PKG_RELEASE)[[:space:]]*[:?+]?=' \
            package/luci-app-mt5700/Makefile || true

      # 10. 生成 H69K 配置
      - name: Generate H69K configuration
        run: |
          set -eu
          cd openwrt

          CONFIG_FILE="$GITHUB_WORKSPACE/rk35xx/h69k-24.10.config"

          if [ ! -s "$CONFIG_FILE" ]; then
            echo "ERROR: H69K 配置文件不存在或为空：$CONFIG_FILE"
            exit 1
          fi

          cp "$CONFIG_FILE" .config

          # 明确启用 MT5700 及中文语言包
          cat >> .config <<'EOF'

          CONFIG_PACKAGE_luci-app-mt5700=y
          CONFIG_PACKAGE_luci-i18n-mt5700-zh-cn=y
          EOF

          echo "H69K base configuration loaded."
          grep -E \
            'CONFIG_TARGET_(rockchip|rockchip_armv8|DEVICE_rockchip_armv8_DEVICE_hinlink_opc-h6xk)=y|CONFIG_PACKAGE_(luci-app-mt5700|luci-i18n-mt5700-zh-cn|luci-app-openclash|luci-app-fan-h69k|docker|dockerd|adguardhome|luci-app-adguardhome)=y' \
            .config || true

      # 11. 补齐依赖并验证配置
      - name: Resolve and verify configuration
        run: |
          set -eu
          cd openwrt

          make defconfig

          check_config() {
            key="$1"
            if ! grep -qxF "${key}=y" .config; then
              echo "ERROR: ${key}=y is missing after make defconfig"
              exit 1
            fi
          }

          check_config CONFIG_TARGET_rockchip
          check_config CONFIG_TARGET_rockchip_armv8
          check_config CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_hinlink_opc-h6xk

          check_config CONFIG_PACKAGE_luci-app-fan-h69k
          check_config CONFIG_PACKAGE_luci-app-openclash
          check_config CONFIG_PACKAGE_luci-app-mt5700

          echo "===== Final MT5700 configuration ====="
          grep -E 'CONFIG_PACKAGE_(luci-app-mt5700|luci-i18n-mt5700-zh-cn)=' .config || true

          echo "===== Final target configuration ====="
          grep '^CONFIG_TARGET_' .config | head -40

      # 12. 下载并编译；无论哪个阶段失败，都保留日志
      - name: Compile H69K firmware
        shell: bash
        run: |
          set -Eeuo pipefail
          cd openwrt

          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=\
          aarch64-openwrt-linux-musl-gcc

          export CC_aarch64_unknown_linux_musl=\
          aarch64-openwrt-linux-musl-gcc

          export AR_aarch64_unknown_linux_musl=\
          aarch64-openwrt-linux-musl-ar

          echo "===== Downloading sources ====="
          make download -j2 2>&1 \
            | tee "$GITHUB_WORKSPACE/build.log"

          echo "===== Starting firmware compilation ====="
          make -j2 V=s 2>&1 \
            | tee -a "$GITHUB_WORKSPACE/build.log"

          echo "===== Build completed ====="

      # 13. 不论成功还是失败，都上传构建日志
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: H69K-iStoreOS-24.10-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      # 14. 只在编译成功后上传固件
      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: H69K-iStoreOS-24.10-Firmware
          path: |
            openwrt/bin/targets/rockchip/armv8/*
            !openwrt/bin/targets/rockchip/armv8/packages/
          if-no-files-found: error
          retention-days: 14
