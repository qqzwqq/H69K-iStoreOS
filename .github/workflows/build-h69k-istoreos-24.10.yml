name: Build H69K iStoreOS 24.10

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  REPO_URL: https://github.com
  REPO_BRANCH: istoreos-24.10
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout customization repository
        uses: actions/checkout@v4

      - name: Cleanup build environment
        run: |
          set -eu
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune --all --force
          df -h

      - name: Install build dependencies
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3 \
            python3-distutils rsync unzip zlib1g-dev \
            file wget curl cpio perl time \
            device-tree-compiler libelf-dev \
            python3-pip python3-venv swig

          python3 -m pip install --user pyelftools

      - name: Install Rust toolchain (Required for MT5700)
        run: |
          set -eu
          curl --proto '=https' --tlsv1.2 -sSf https://rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          source $HOME/.cargo/env
          rustc --version

      - name: Clone official iStoreOS 24.10 source
        run: |
          set -eu
          git clone --depth=1 --branch "$REPO_BRANCH" "$REPO_URL" openwrt

      - name: Update and install feeds
        run: |
          set -eu
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add custom packages
        run: |
          set -eu
          cd openwrt
          
          # 1. 如果存在外部预处理脚本则执行（同时对缺失的目录创建兜底）
          if [ -f "$GITHUB_WORKSPACE/scripts/prepare-h69k-24.10.sh" ]; then
            chmod +x "$GITHUB_WORKSPACE/scripts/prepare-h69k-24.10.sh"
            "$GITHUB_WORKSPACE/scripts/prepare-h69k-24.10.sh"
          fi
          mkdir -p package

          # 2. 集成 OpenClash 源码
          git clone --depth=1 --branch master https://github.com /tmp/OpenClash
          cp -a /tmp/OpenClash/luci-app-openclash package/luci-app-openclash

          # 3. 集成 luci-app-mt5700 5G模组管理套件（包含中文语言包）
          git clone --depth=1 --branch main https://github.com package/luci-app-mt5700

      - name: Generate H69K Target Configuration
        run: |
          set -eu
          cd openwrt

          # 直接将你提供的精简配置项写入 .config
          cat <<EOF > .config
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_hinlink_opc-h6xk=y

          CONFIG_PACKAGE_luci-app-fan-h69k=y
          CONFIG_PACKAGE_kmod-hwmon-pwmfan=y
          CONFIG_PACKAGE_kmod-thermal=y
          CONFIG_PACKAGE_docker=y
          CONFIG_PACKAGE_dockerd=y
          CONFIG_PACKAGE_adguardhome=y
          CONFIG_PACKAGE_luci-app-adguardhome=y
          CONFIG_PACKAGE_luci-app-openclash=y

          # 自动注入 MT5700 5G模块管理与中文语言包配置
          CONFIG_PACKAGE_luci-app-mt5700=y
          CONFIG_PACKAGE_luci-i18n-mt5700-zh-cn=y
          EOF

          echo "===== Initial .config generated ====="
          cat .config

      - name: Resolve and verify configuration
        run: |
          set -eu
          cd openwrt

          # 依赖补全与结构展开
          make defconfig

          echo "===== Verified target and package configuration ====="
          check_config() {
            key="$1"
            if ! grep -qxF "${key}=y" .config; then
              echo "ERROR: ${key}=y is missing after make defconfig."
              exit 1
            fi
          }

          check_config CONFIG_TARGET_rockchip
          check_config CONFIG_TARGET_rockchip_armv8
          check_config CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_hinlink_opc-h6xk
          check_config CONFIG_PACKAGE_luci-app-fan-h69k
          check_config CONFIG_PACKAGE_luci-app-openclash
          check_config CONFIG_PACKAGE_luci-app-mt5700

      - name: Compile the firmware
        run: |
          set -eu
          cd openwrt
          
          echo "===== Downloading source dependencies ====="
          make download -j$(nproc)
          
          echo "===== Starting multi-thread compilation ====="
          # 优先多线程编译，如果报错则自动回退到单线程输出详细日志
          make -j$(nproc) || make -j1 V=s

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iStoreOS-H69K-Firmware
          path: openwrt/bin/targets/rockchip/armv8/*.img.gz
