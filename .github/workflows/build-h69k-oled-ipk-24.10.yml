name: Build H69K OLED IPK (24.10)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai
  REPO_BRANCH: istoreos-24.10
  OLED_COMMIT: ad7132558b2b66a88d7c491d5fbaec532cc2e9e1

jobs:
  build-oled:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout H69K customization repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-distutils rsync unzip zlib1g-dev file wget curl \
            cpio perl time device-tree-compiler libelf-dev python3-pip \
            python3-venv swig pkg-config
          python3 -m pip install --user pyelftools

      - name: Clone iStoreOS 24.10 source
        run: |
          set -Eeuo pipefail
          git clone --depth=1 --branch "$REPO_BRANCH" \
            https://github.com/istoreos/istoreos.git openwrt
          git -C openwrt log -1 --oneline

      - name: Prepare feeds and H69K OLED package
        shell: bash
        run: |
          set -Eeuo pipefail
          cd openwrt

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          rm -rf /tmp/luci-app-oled package/luci-app-oled
          git clone https://github.com/NateLol/luci-app-oled.git /tmp/luci-app-oled
          git -C /tmp/luci-app-oled checkout "$OLED_COMMIT"
          test -s /tmp/luci-app-oled/luci-app-oled/Makefile
          mkdir -p package/luci-app-oled
          cp -a /tmp/luci-app-oled/luci-app-oled/. package/luci-app-oled/

          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              "luasrc/model/cbi/oled/setting.lua": ("o.default='/dev/i2c-0'", "o.default='/dev/i2c-5'"),
              "root/etc/config/oled": ("option path '/dev/i2c-0'", "option path '/dev/i2c-5'"),
              "src/I2C_Library/I2C.h": ('#define I2C_DEV0_PATH "/dev/i2c-0"', '#define I2C_DEV0_PATH "/dev/i2c-5"'),
          }
          for name, (old, new) in replacements.items():
              p = Path("package/luci-app-oled") / name
              if not p.is_file():
                  raise SystemExit(f"Missing expected OLED file: {p}")
              data = p.read_text()
              if new not in data:
                  if data.count(old) != 1:
                      raise SystemExit(f"Unexpected I2C default in {p}")
                  p.write_text(data.replace(old, new, 1))
          PY

          grep -Fq "o.default='/dev/i2c-5'" package/luci-app-oled/luasrc/model/cbi/oled/setting.lua
          grep -Fq "option path '/dev/i2c-5'" package/luci-app-oled/root/etc/config/oled
          grep -Fq '#define I2C_DEV0_PATH "/dev/i2c-5"' package/luci-app-oled/src/I2C_Library/I2C.h
          grep -Fq "uci_write_config '/dev/i2c-5' 1 1 eth0" package/luci-app-oled/root/etc/uci-defaults/oled

      - name: Configure minimal H69K build
        shell: bash
        run: |
          set -Eeuo pipefail
          cd openwrt
          cat > .config <<'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_hinlink_opc-h6xk=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-app-oled=y
          CONFIG_PACKAGE_luci-i18n-oled-zh-cn=y
          CONFIG_PACKAGE_libconfig=y
          EOF
          make defconfig
          grep -E '^(CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_hinlink_opc-h6xk|CONFIG_PACKAGE_luci-app-oled|CONFIG_PACKAGE_luci-i18n-oled-zh-cn|CONFIG_PACKAGE_libconfig)=' .config

      - name: Build OLED packages only
        shell: bash
        run: |
          set -Eeuo pipefail
          cd openwrt

          # Bootstrap OpenWrt host tools required by package extraction/build.
          make -j"$(nproc)" tools/install
          test -x staging_dir/host/bin/libdeflate-gzip

          # Build and install the target cross-toolchain before compiling
          # packages. Without this stage, libc's ld-musl runtime files are
          # missing and package/libs/toolchain fails during IPK creation.
          make -j"$(nproc)" toolchain/install
          TOOLCHAIN_LIB="$(find staging_dir -maxdepth 3 -type f -name 'ld-musl-*.so*' -print -quit)"
          if [ -z "$TOOLCHAIN_LIB" ]; then
            echo "::error::musl runtime loader was not installed by toolchain/install"
            find staging_dir -maxdepth 4 -type f -name '*musl*' -print | head -100
            exit 1
          fi
          echo "Verified toolchain runtime: $TOOLCHAIN_LIB"

          # Compile OLED and its required dependencies for H69K.
          make -j"$(nproc)" package/luci-app-oled/compile V=s

          echo "===== Locate generated OLED IPKs ====="
          find bin/packages -type f \( -name 'luci-app-oled_*.ipk' -o -name 'luci-i18n-oled-zh-cn_*.ipk' \) -print
          mkdir -p "$GITHUB_WORKSPACE/oled-ipk"
          find bin/packages -type f \( -name 'luci-app-oled_*.ipk' -o -name 'luci-i18n-oled-zh-cn_*.ipk' \) -exec cp -v {} "$GITHUB_WORKSPACE/oled-ipk/" \;
          test -n "$(find "$GITHUB_WORKSPACE/oled-ipk" -type f -name '*.ipk' -print -quit)"

      - name: Upload H69K OLED IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: H69K-OLED-iStoreOS-24.10-aarch64
          path: oled-ipk/*.ipk
          if-no-files-found: error
          retention-days: 30
