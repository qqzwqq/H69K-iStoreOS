name: H69K St2 - Package Full Image

on:
  workflow_dispatch:
    inputs:
      openwrt_kernel:
        description: "选择内核版本（H69K 优先测试 6.6.y）"
        required: true
        default: "6.6.y"
        type: choice
        options:
          - "6.6.y"
          - "6.12.y"
          - "6.18.y"
      auto_kernel:
        description: "自动选择匹配的最新内核"
        required: true
        default: true
        type: boolean
      kernel_usage:
        description: "内核标签"
        required: true
        default: "stable"
        type: choice
        options:
          - "stable"
          - "flippy"
          - "beta"
      network_settings:
        description: "选择第一步生成的 Rootfs 网络配置"
        required: true
        default: "dhcp"
        type: choice
        options:
          - "dhcp"
          - "static"

env:
  VERSION: "25.12.6"

jobs:
  package-h69k:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Stage 1 Rootfs
        env:
          NETWORK_SETTINGS: ${{ inputs.network_settings }}
          REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          mkdir -p bin/targets/armsr/armv8
          ROOTFS_URL="https://github.com/${REPO}/releases/download/iStoreOS-${VERSION}-RELEASE-${NETWORK_SETTINGS}/istoreos-armsr-armv8-generic-rootfs.tar.gz"
          echo "Downloading: ${ROOTFS_URL}"
          curl -fL --retry 3 --retry-delay 3 "${ROOTFS_URL}" \
            -o bin/targets/armsr/armv8/istoreos-armsr-armv8-generic-rootfs.tar.gz
          test -s bin/targets/armsr/armv8/istoreos-armsr-armv8-generic-rootfs.tar.gz
          tar -tzf bin/targets/armsr/armv8/istoreos-armsr-armv8-generic-rootfs.tar.gz >/dev/null
          ls -lh bin/targets/armsr/armv8/

      - name: Package H69K image
        uses: ophub/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: bin/targets/armsr/armv8/istoreos-armsr-armv8-generic-rootfs.tar.gz
          openwrt_board: h69k
          openwrt_kernel: ${{ inputs.openwrt_kernel }}
          auto_kernel: ${{ inputs.auto_kernel }}
          kernel_repo: ophub/kernel
          kernel_usage: ${{ inputs.kernel_usage }}
          # Ophub 镜像分区大小：BOOTFS 256 MiB / ROOTFS 1024 MiB。
          openwrt_size: 256/1024
          # 保留 ST1 中设置的管理网段。
          openwrt_ip: 192.168.66.1
          builder_name: H69K-iStoreOS

      - name: Verify packaged image
        run: |
          set -Eeuo pipefail
          echo "PACKAGED_OUTPUTPATH=${PACKAGED_OUTPUTPATH:-<unset>}"
          if [ -z "${PACKAGED_OUTPUTPATH:-}" ] || [ ! -d "${PACKAGED_OUTPUTPATH}" ]; then
            echo "::error::打包动作没有提供有效的 PACKAGED_OUTPUTPATH"
            exit 1
          fi
          find "${PACKAGED_OUTPUTPATH}" -maxdepth 1 -type f -name '*.img.gz' -ls
          test -n "$(find "${PACKAGED_OUTPUTPATH}" -maxdepth 1 -type f -name '*.img.gz' -print -quit)"
          for f in "${PACKAGED_OUTPUTPATH}"/*.img.gz; do
            gzip -t "$f"
          done

      # 额外检查镜像的实际分区和启动文件。仅做只读检查，不改写镜像内容。
      - name: Inspect H69K image layout and boot files
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y fdisk util-linux e2fsprogs
          IMAGE_GZ="$(find "${PACKAGED_OUTPUTPATH}" -maxdepth 1 -type f -name '*.img.gz' -print -quit)"
          test -n "$IMAGE_GZ"
          RAW_IMAGE="$RUNNER_TEMP/h69k-inspect.img"
          LOOP=""
          MOUNT_DIR="$RUNNER_TEMP/h69k-boot-inspect"
          cleanup() {
            if mountpoint -q "$MOUNT_DIR"; then sudo umount "$MOUNT_DIR" || true; fi
            if [ -n "$LOOP" ]; then sudo losetup -d "$LOOP" || true; fi
            rm -f "$RAW_IMAGE"
          }
          trap cleanup EXIT

          echo "===== 压缩镜像大小 / SHA256 ====="
          ls -lh "$IMAGE_GZ"
          sha256sum "$IMAGE_GZ"

          echo "===== 解压镜像并读取分区表 ====="
          gzip -dc "$IMAGE_GZ" > "$RAW_IMAGE"
          sudo fdisk -l "$RAW_IMAGE"

          echo "===== 分区设备识别 ====="
          LOOP="$(sudo losetup --find --show --partscan "$RAW_IMAGE")"
          sudo udevadm settle
          sudo lsblk -o NAME,SIZE,FSTYPE,LABEL,PARTLABEL,PARTUUID "$LOOP"

          echo "===== 检查第一分区中的启动文件 ====="
          mkdir -p "$MOUNT_DIR"
          BOOT_PART="${LOOP}p1"
          if [ -b "$BOOT_PART" ]; then
            if sudo mount -o ro "$BOOT_PART" "$MOUNT_DIR"; then
              sudo find "$MOUNT_DIR" -maxdepth 5 -type f -printf '%P (%s bytes)\n' | sort | head -n 300
              echo "===== H69K / RK3568 设备树候选 ====="
              sudo find "$MOUNT_DIR" -type f \( -iname '*h69k*.dtb' -o -iname '*hlink*69k*.dtb' -o -iname 'rk3568*.dtb' \) -print
              echo "===== 启动配置候选 ====="
              sudo find "$MOUNT_DIR" -type f \( -iname 'boot.scr' -o -iname 'extlinux.conf' -o -iname 'armbianEnv.txt' -o -iname 'uEnv.txt' \) -print
              sudo umount "$MOUNT_DIR"
            else
              echo "::warning::第一分区未能以只读方式挂载；请结合上方分区表检查文件系统类型。"
            fi
          else
            echo "::warning::未找到常见的第一分区设备名 ${BOOT_PART}，请检查上方 lsblk 输出。"
          fi
          echo "===== 镜像结构检查结束（本步骤不代表已通过真实硬件启动测试）====="

      - name: Rename image files
        run: |
          set -Eeuo pipefail
          for FILE in "${PACKAGED_OUTPUTPATH}"/*.img.gz; do
            [ -f "$FILE" ] || continue
            FILENAME="$(basename "$FILE")"
            NEW_FILENAME="${FILENAME/openwrt/istoreos_${VERSION}}"
            if [ "$FILENAME" != "$NEW_FILENAME" ]; then
              mv "$FILE" "${PACKAGED_OUTPUTPATH}/$NEW_FILENAME"
            fi
          done
          ls -lh "${PACKAGED_OUTPUTPATH}"/*.img.gz
          mkdir -p packaged-output
          cp -f "${PACKAGED_OUTPUTPATH}"/*.img.gz packaged-output/
          test -n "$(find packaged-output -maxdepth 1 -type f -name '*.img.gz' -print -quit)"

      - name: Upload H69K firmware to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: iStoreOS-${{ env.VERSION }}-RELEASE-${{ inputs.network_settings }}
          name: iStoreOS ${{ env.VERSION }} H69K (${{ inputs.network_settings }})
          body: |
            ## 第二阶段：构建 HINLINK OPC-H69K 固件镜像

            使用第一阶段生成的通用 Rootfs 底包，为 HINLINK OPC-H69K 路由器打包最终可刷写的固件镜像。

            - **目标设备：** HINLINK OPC-H69K
            - **Ophub 设备型号：** `h69k`
            - **内核版本分支：** ${{ inputs.openwrt_kernel }}
            - **内核通道：** ${{ inputs.kernel_usage }}
            - **底包来源：** 第一阶段生成的通用 Rootfs
            - **网络模式：** ${{ inputs.network_settings == 'dhcp' && 'DHCP 自动获取地址' || '静态 IP' }}
            - **LAN 管理地址：** `192.168.66.1`
            - **分区布局：** Ophub 默认布局（BOOTFS 256 MiB / ROOTFS 1024 MiB）

            默认优先使用 6.6.y 内核作为 H69K 兼容性基线。打包后会检查镜像分区表、第一分区文件列表和设备树/启动配置候选；静态检查不能替代真实 H69K 硬件启动测试。
          files: packaged-output/*.img.gz
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
